{% extends 'base.html' %}

{% block title %}Mes préférences — Inforest{% endblock %}

{% block content %}
  <a href="{% url 'accounts:profile' %}" class="back">← Retour au profil</a>
  <h1>Mes préférences</h1>

  <section class="card form-card">
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="button">Enregistrer</button>
    </form>
  </section>
{% endblock %}
