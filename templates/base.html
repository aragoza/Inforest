{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}InForêt{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <header class="navbar">
    <a href="{% url 'home' %}" class="brand">InForêt</a>

    <nav class="tabs">
      <a href="{% url 'news:liste' %}"
         class="{% if request.resolver_match.app_name == 'news' %}active{% endif %}">Actualités</a>
      <a href="{% url 'discovery:list' %}"
         class="{% if request.resolver_match.app_name == 'discovery' %}active{% endif %}">Découverte</a>
      <a href="{% url 'maps:map' %}"
         class="{% if request.resolver_match.app_name == 'maps' %}active{% endif %}">Carte</a>
      {% if user.is_authenticated %}
        <a href="#">Profil</a>
      {% else %}
        <a href="#" class="login">Se connecter</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>Tous droits réservés &copy; InForêt</p>
  </footer>

</body>
</html>
